# nixpacks.toml — Railway build config cho Playwright Chromium
# Cài system libraries mà Chromium headless cần (libglib, libnss, v.v.)

[phases.setup]
nixPkgs = [
    "glib",
    "nss",
    "nspr",
    "atk",
    "cups",
    "libdrm",
    "xorg.libX11",
    "xorg.libXcomposite",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXrandr",
    "xorg.libxcb",
    "mesa",
    "alsa-lib",
    "expat",
    "pango",
    "cairo",
    "dbus",
    "libxkbcommon",
    "at-spi2-atk",
    "at-spi2-core",
]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium",
]

[start]
cmd = "python main.py"
